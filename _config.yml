# GitHub Pages（Jekyll）の設定。**この 1 つの目的のためだけに置いてある。**
#
# `tools/tl/` は TL エディタの実体で、Discord の門（tl.arona-bot.com）の
# 向こうに置くものです。ところが Pages はリポジトリの根をそのまま配るので、
# **門を通らずに arona-bot.com/tools/tl/ で誰でも開けていました**
# （2026-09-04 の先生の「一旦非公開にしてほしい、TLToolだけ」で見つけた）。
#
# ここに挙げたものは Pages の出力に入りません。**git には残る**ので、
# `scripts/deploy-tl.sh`（手元の作業木から rsync）は今までどおり動きます。
# 公開に戻すときは下の 2 行を消してください。
#
# **`tl`（説明ページ `/tl/`）も 2026-09-20 に外しました**（先生の「TL エディタの
# 記載消しちゃっていいよ」）。同じ日にトップページの「準備中」の枠も消しています。
# どちらも git には残っているので、戻すのは `exclude` から削るのと、
# `git log -- index.html` から枠を拾い直すのとの 2 手です。
#
# `exclude` を書くと Jekyll の既定の一覧（Gemfile / node_modules / vendor）が
# 置き換わります。**このリポジトリにはどれも無い**ので影響はありません。
#
# **末尾の `/` を消さないこと。** Jekyll の exclude は前方一致で、`tools/tl` と書くと
# `tools/tl-engine.js` まで外れる。2026-09-04 から 09-26 まで本番の cost-timeline が
# これで 404 を踏んで動いていなかった（手元の http.server では再現しない）。
exclude:
  - tools/tl/
  - tl/
