<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>素材の逆引きへ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/farm/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **オーパーツ逆引きは 2026-09-26 に「素材の逆引き」の「誰が使う」の区画へまとめた**
     （素材の掘り場・oopart の 2 本を 1 本に）。古いリンクと共有 URL のために転送だけする。

     元の形   #種類|系統|並び|範囲（潜在解放からは #oopart|系統 の 2 つ、種類だけの #note もある）
     渡す形   ../farm/#m=系統&u=並び|範囲&pane=use
              素材は区画の外の m=。系統（無ければ種類）のまま渡し、向こうが 1 段の素材に直す。
              残りはそのまま u= に入れる。読み方は向こうの use.js が元のまま持っている。
     **入力の覚え（localStorage の arona-state-/tools/oopart/）は同じオリジンなので、向こうが読む**（消さない） -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* そのまま使う */ }
  var seg = [];
  if (h) {
    var p = h.split('|'), m = p[1] || p[0];
    if (m) seg.push('m=' + m);
    if (p.length > 2) seg.push('u=' + p.slice(2).join('|'));
  }
  seg.push('pane=use');
  location.replace('../farm/#' + seg.join('&'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../farm/#pane=use"></noscript>
</head>
<body>
<p>オーパーツ逆引きは、<a href="../farm/#pane=use">素材の逆引きの「誰が使う」</a>にまとめました。</p>
</body>
</html>
