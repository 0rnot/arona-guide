<title>装備の計算機へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/equipment/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **装備の効果早見は 2026-09-26 に「装備の計算機」の「効果の早見」の区画へまとめた**
     （grill-me、先生「装備は装備で一つにまとめたい」）。古いリンクと共有 URL のために転送だけする。

     元の形   #g=面~部位~地形~並べ替え~固有の段~検索~検索（無いこともある）
     渡す形   ../equipment/#pane=stats&g=…。`g=` の区画はそのまま、向こうの gear.js が読む -->
<script>
(function () {
  var g = location.hash.replace(/^#/, '').split('&').filter(function (x) { return x.indexOf('g=') === 0; })[0];
  location.replace('../equipment/#pane=stats' + (g ? '&' + g : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../equipment/#pane=stats"></noscript>
</head>
<body>
<p>装備の効果早見は、<a href="../equipment/#pane=stats">装備の計算機の「効果の早見」</a>にまとめました。</p>
</body>
</html>
