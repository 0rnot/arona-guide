<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>総力戦へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/raid/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **総力戦の開催カレンダーは 2026-09-26 に「総力戦」の「開催」の区画へまとめた**
     （grill-me Q12-1）。古いリンクと共有 URL のために転送だけする。

     元の形   #rc=種類~地形~ボスの番号&pane=boss|rec|gap
     渡す形   ../raid/#pane=cal&rc=<元のまま>&cp=<元の pane>。ボスの番号は向こうの
              「古い URL を直す（その 2）」が先頭の選択（rb=）へ移す -->
<script>
(function () {
  var out = ['pane=cal'];
  location.hash.replace(/^#/, '').split('&').forEach(function (x) {
    if (x.indexOf('rc=') === 0) out.push(x);
    var m = /^pane=(boss|rec|gap)$/.exec(x);
    if (m && m[1] !== 'boss') out.push('cp=' + m[1]);
  });
  location.replace('../raid/#' + out.join('&'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../raid/#pane=cal"></noscript>
</head>
<body>
<p>総力戦の開催カレンダーは、<a href="../raid/#pane=cal">総力戦の「開催」</a>にまとめました。</p>
</body>
</html>
