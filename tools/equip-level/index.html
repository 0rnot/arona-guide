<!-- **装備の強化珠計算機は 2026-09-26 に「装備の計算機」の「強化珠」の区画へまとめた**
     （grill-me、先生「装備は装備で一つにまとめたい」）。古いリンクと共有 URL のために転送だけする。

     元の形   #T.Lv.T.Lv.個数,…|初級.中級.上級.最上級（`&pane=…` が付いたものもある）
     渡す形   ../equipment/#pane=level&lv=<元の & より前>。中身は向こうの level.js がそのまま読む -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '').split('&')[0];
  location.replace('../equipment/#pane=level' + (h ? '&lv=' + h : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../equipment/#pane=level"></noscript>
</head>
<body>
<p>装備の強化珠計算機は、<a href="../equipment/#pane=level">装備の計算機の「強化珠」</a>にまとめました。</p>
</body>
</html>
