<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>絆と贈り物の計算機へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/bond/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **贈り物の逆引きは 2026-09-26 に「絆と贈り物の計算機」の「贈り物から」の区画へまとめた**
     （grill-me、先生「絆は全部まとめられる？」）。古いリンクと共有 URL のために転送だけする。

     元の形   #贈り物id|出す倍率|学校（学校は encodeURIComponent 済み）
     渡す形   ../bond/#pane=gift&gf=<元のハッシュ>。中身は向こうの「贈り物から」がそのまま読む -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '').split('&')[0];
  location.replace('../bond/#pane=gift' + (h ? '&gf=' + h : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../bond/#pane=gift"></noscript>
</head>
<body>
<p>贈り物の逆引きは、<a href="../bond/#pane=gift">絆と贈り物の計算機の「贈り物から」</a>にまとめました。</p>
</body>
</html>
