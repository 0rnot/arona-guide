<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>生徒の育成計算機へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/student-cost/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **星上げの計算機は 2026-09-26 に「生徒の育成計算機」の「星上げ」の区画へまとめた**
     （student-cost・eleph・potential の 3 本を 1 本に）。古いリンクと共有 URL のために転送だけする。

     元の形   #生徒id|今|目標|手持ち||累計購入数（student-cost からは #生徒id|今|目標 の 3 つ）
     渡す形   ../student-cost/#s=生徒id&e=今|目標|手持ち||累計購入数&pane=star
              生徒は区画の外の s=、残りはそのまま e= に入れる。読み方は向こうの star.js が元のまま持っている。
     **入力の覚え（localStorage の arona-state-/tools/eleph/）は同じオリジンなので、向こうが読む**（消さない） -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* そのまま使う */ }
  var seg = [];
  if (h) {
    var p = h.split('|'), id = parseInt(p[0], 10);
    if (id > 0) seg.push('s=' + id);
    if (p.length > 1) seg.push('e=' + p.slice(1).join('|'));
  }
  seg.push('pane=star');
  location.replace('../student-cost/#' + seg.join('&'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../student-cost/#pane=star"></noscript>
</head>
<body>
<p>星上げの計算機は、<a href="../student-cost/#pane=star">生徒の育成計算機の「星上げ」</a>にまとめました。</p>
</body>
</html>
