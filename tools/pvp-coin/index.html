<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>戦術対抗戦へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/pvp-ladder/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **戦術対抗戦コインの収支は 2026-09-26 に「戦術対抗戦」の「コインの収支」の区画へまとめた**
     （grill-me Q13-1）。古いリンクと共有 URL のために転送だけする。

     元の形   #pc=順位帯~防衛~ドリンク~更新~神名文字~1日1回~手持ち~目標
     渡す形   ../pvp-ladder/#pane=coin&pc=<元のまま>。順位帯に数字が入っているので、
              向こうでは「選び直した帯」として読まれる（目標の帯には合わせない） -->
<script>
(function () {
  var pc = location.hash.replace(/^#/, '').split('&').filter(function (x) {
    return x.indexOf('pc=') === 0;
  })[0];
  location.replace('../pvp-ladder/#pane=coin' + (pc ? '&' + pc : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../pvp-ladder/#pane=coin"></noscript>
</head>
<body>
<p>戦術対抗戦コインの収支は、<a href="../pvp-ladder/#pane=coin">戦術対抗戦の「コインの収支」</a>にまとめました。</p>
</body>
</html>
