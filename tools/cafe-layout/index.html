<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>カフェへ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/cafe/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **カフェの家具配置は 2026-09-26 に「カフェ」の「家具配置」の区画へまとめた**
     （grill-me Q18-1）。古いリンクと共有 URL のために転送だけする。

     元の形   #c=店&r=ランク&m=床材.壁紙.背景&i=家具,面,x,y,回転_…
     渡す形   ../cafe/#pane=layout&<元のまま>。c・r は向こうでは区画の外の「カフェとランク」、
              m・i は家具配置の区画がそのまま読む。
     **並びの保存（localStorage の arona-cafe-layout）は同じオリジンなので、キーを変えずに向こうが読む** -->
<script>
(function () {
  var rest = location.hash.replace(/^#/, '').split('&').filter(function (x) {
    return x && x.indexOf('pane=') !== 0;
  });
  location.replace('../cafe/#' + ['pane=layout'].concat(rest).join('&'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../cafe/#pane=layout"></noscript>
</head>
<body>
<p>カフェの家具配置は、<a href="../cafe/#pane=layout">カフェの「家具配置」</a>にまとめました。</p>
</body>
</html>
