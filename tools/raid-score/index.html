<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>総力戦へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/raid/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **総力戦のスコア計算機は 2026-09-26 に「総力戦」の「スコア」の区画へまとめた**
     （grill-me Q12-1）。古いリンクと共有 URL のために転送だけする。

     元の形   #rs=種類~開発名~難易度~凸数~入れ方~凸ごとの秒~HP~目標
     渡す形   ../raid/#pane=score&rs=<元のまま>。相手（種類・開発名・難易度）は向こうの
              「古い URL を直す（その 2）」が先頭の選択（rb=）へ移す -->
<script>
(function () {
  var rs = location.hash.replace(/^#/, '').split('&').filter(function (x) {
    return x.indexOf('rs=') === 0;
  })[0];
  location.replace('../raid/#pane=score' + (rs ? '&' + rs : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../raid/#pane=score"></noscript>
</head>
<body>
<p>総力戦のスコア計算機は、<a href="../raid/#pane=score">総力戦の「スコア」</a>にまとめました。</p>
</body>
</html>
