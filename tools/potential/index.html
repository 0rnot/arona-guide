<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>生徒の育成計算機へ移りました｜AronaBot</title>
<link rel="canonical" href="https://arona-bot.com/tools/student-cost/">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- **潜在能力解放の計算機は 2026-09-26 に「生徒の育成計算機」の「潜在解放」の区画へまとめた**
     （student-cost・eleph・potential の 3 本を 1 本に）。古いリンクと共有 URL のために転送だけする。

     元の形   #生徒id|今|目標|欠片|壊れた|WB×3（今と目標は枠 3 つを , で）。もっと古い形は
              #生徒id|今|目標|欠片|壊れた|WB合計[|a<オーパーツ>] で、読み方は向こうの pot.js が元のまま持っている
     渡す形   ../student-cost/#s=生徒id&p=今|目標|…&pane=pot（生徒は区画の外の s=、残りはそのまま p=）
     **入力の覚え（localStorage の arona-state-/tools/potential/）は同じオリジンなので、向こうが読む**（消さない） -->
<script>
(function () {
  var h = location.hash.replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* そのまま使う */ }
  var seg = [];
  if (h) {
    var p = h.split('|'), id = parseInt(p[0], 10);
    if (id > 0) seg.push('s=' + id);
    if (p.length > 1) seg.push('p=' + p.slice(1).join('|'));
  }
  seg.push('pane=pot');
  location.replace('../student-cost/#' + seg.join('&'));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../student-cost/#pane=pot"></noscript>
</head>
<body>
<p>潜在能力解放の計算機は、<a href="../student-cost/#pane=pot">生徒の育成計算機の「潜在解放」</a>にまとめました。</p>
</body>
</html>
